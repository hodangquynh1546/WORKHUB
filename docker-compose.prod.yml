name: workhub-prod

# Production stack: PostgreSQL + backend + nginx (SPA and reverse proxy). Put TLS in front of the `web` service
# (load balancer, Caddy, Traefik...) and make it send X-Forwarded-Proto.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Required in .env: JWT_SECRET, DB_PASSWORD, FRONTEND_BASE_URL (https://...). See .env.example.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: ${DB_USERNAME:-workhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-workhub} -d workhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workhub
      DB_USERNAME: ${DB_USERNAME:-workhub}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL in .env}
      REFRESH_COOKIE_SECURE: "true"
      TIME_ZONE: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@workhub.local}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Daily dump into the `backups` volume, dumps older than BACKUP_KEEP_DAYS are pruned. Copy them off the host too
  # (docker cp / rsync): a backup on the same disk does not survive losing the disk. Restore: scripts/restore.sh.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-workhub}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: workhub
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/backups/workhub-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump --format=custom --compress=6 -f "$$f.partial"; then mv "$$f.partial" "$$f"; echo "backup written: $$f"; else echo "backup FAILED" >&2; fi
          find /backups -name 'workhub-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  postgres-data:
  backups:
