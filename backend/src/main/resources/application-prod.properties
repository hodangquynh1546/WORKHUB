# Production profile (SPRING_PROFILES_ACTIVE=prod; it also activates the postgres profile).
# ProductionGuard refuses to start with the placeholder JWT secret or a non-Secure refresh cookie.
spring.h2.console.enabled=false

# Behind a reverse proxy (nginx in docker-compose.prod.yml): trust X-Forwarded-* so client addresses and https are right.
server.forward-headers-strategy=native

# Only health is exposed, and without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never put stack traces or messages in error bodies.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Connection pool sized for one instance (PostgreSQL's default max_connections is 100).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
