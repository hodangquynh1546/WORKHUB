# Activate with SPRING_PROFILES_ACTIVE=postgres. Start the database with `docker compose up -d` from the repo root.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/workhub}
spring.datasource.username=${DB_USERNAME:workhub}
spring.datasource.password=${DB_PASSWORD:workhub}
spring.h2.console.enabled=false
