spring.application.name=workhub-backend

# Load the repo-root .env (see .env.example) when present. The backend runs from backend/, hence ../
spring.config.import=optional:file:../.env[.properties]

# Default profile: in-memory H2 in PostgreSQL compatibility mode, no Docker needed. Data is lost on restart.
spring.datasource.url=jdbc:h2:mem:workhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (HS256). Override JWT_SECRET outside local development; it must be at least 32 bytes.
workhub.jwt.issuer=workhub
workhub.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
workhub.jwt.access-token-ttl=15m

# Auth flows. Links in emails point at the frontend.
workhub.auth.refresh-token-ttl=14d
workhub.auth.email-verification-ttl=24h
workhub.auth.password-reset-ttl=1h
# Must be true when served over HTTPS.
workhub.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
workhub.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Invitations into workspaces and teams.
workhub.invitations.ttl=7d

# Calendar days (sprint snapshots, "today") are computed in this zone; timestamps themselves stay UTC.
workhub.time-zone=${TIME_ZONE:Asia/Ho_Chi_Minh}

# Document attachments (stored in the database); the avatar endpoint applies its own, smaller limit.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Brute-force guard on sign-in, sign-up, password reset and e-mail verification (per client address, in memory).
workhub.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
workhub.rate-limit.auth-requests=${RATE_LIMIT_AUTH_REQUESTS:20}
workhub.rate-limit.window=1m

# Smaller responses for JSON and text.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/csv,text/html

# SPRING_PROFILES_ACTIVE=prod runs on PostgreSQL with the production checks (see application-prod.properties).
spring.profiles.group.prod=postgres,prod

# Outgoing email. MAIL_ENABLED=false (default) only writes emails to the log; true sends them through SMTP.
workhub.mail.enabled=${MAIL_ENABLED:false}
workhub.mail.from=${MAIL_FROM:no-reply@workhub.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# An unreachable SMTP server must not turn the health check (and the container) red.
management.health.mail.enabled=false
