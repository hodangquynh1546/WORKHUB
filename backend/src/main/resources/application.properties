spring.application.name=workhub-backend

# Default profile: in-memory H2 in PostgreSQL compatibility mode, no Docker needed. Data is lost on restart.
spring.datasource.url=jdbc:h2:mem:workhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (HS256). Override JWT_SECRET outside local development; it must be at least 32 bytes.
workhub.jwt.issuer=workhub
workhub.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
workhub.jwt.access-token-ttl=15m
